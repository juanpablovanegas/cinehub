<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Consulta y responde a un plan de cine de CineHub.">
  <title>Plan de cine — CineHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/responsive.css">

</head>

<body class="min-h-screen bg-gray-100 text-gray-900 dark:bg-gray-950 dark:text-white">
  <header class="site-header">
    <a class="logo" href="index.html">CineHub</a>
    <nav aria-label="Navegación principal">
      <ul class="nav-list">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="index.html#peliculas">Películas</a></li>
        <li><a href="index.html#mis-planes">Mis planes</a></li>
        <li><a href="about.html">Acerca de</a></li>
      </ul>
    </nav>
    <button id="theme-toggle" type="button" class="btn" aria-label="Cambiar tema" aria-pressed="false">🌙 Modo oscuro</button>
  </header>

  <main>
    <section class="px-6 py-12 md:px-10 lg:px-16" aria-labelledby="plan-title">
      <div class="mx-auto max-w-4xl">
        <p class="font-semibold uppercase tracking-wide text-pink-600">Plan compartido</p>
        <h1 id="plan-title" class="mt-2 text-4xl font-extrabold">Tu plan de cine</h1>

        <article class="plan-card mt-8">
          <h2 id="plan-name-display" class="text-2xl font-bold">Plan de CineHub</h2>

          <div class="plan-info">
            <div class="plan-info-item"><span>Película</span><strong id="plan-movie">—</strong></div>
            <div class="plan-info-item"><span>Cine</span><strong id="plan-cinema">—</strong></div>
            <div class="plan-info-item"><span>Fecha</span><strong id="plan-date">—</strong></div>
            <div class="plan-info-item"><span>Hora</span><strong id="plan-time">—</strong></div>
            <div class="plan-info-item"><span>Invitados</span><strong id="plan-invitees">—</strong></div>
          </div>

          <div class="mt-8">
            <h3 class="mb-4 text-xl font-bold">¿Vas a asistir?</h3>

            <div class="response-group">
              <button class="response-btn" data-response="Voy" type="button">✅ Voy</button>
              <button class="response-btn" data-response="Tal vez" type="button">🤔 Tal vez</button>
              <button class="response-btn" data-response="No puedo" type="button">❌ No puedo</button>
            </div>

            <p id="response-message" class="message message-success mt-5" hidden aria-live="polite"></p>
          </div>
        </article>

        <div class="mt-6 flex flex-wrap gap-3">
          <a class="btn" href="index.html#mis-planes">Ver mis planes</a>
          <a class="btn btn-secondary" href="index.html#peliculas">Crear otro plan</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>CineHub · Universidad de La Sabana</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
